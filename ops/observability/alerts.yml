# Alert rules for the game server. Thresholds are starting points: tune them
# against a week of real traffic before paging anyone on them.
groups:
  - name: lms-money
    rules:
      - alert: CrossChainJoinStuck
        expr: max by (origin) (lms_crosschain_stuck) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "A stake forwarded from chain {{ $labels.origin }} has not reached the hub"
          description: >
            A spoke emitted JoinForwarded and the hub has neither seated nor refunded the
            player within CROSSCHAIN_STUCK_MS. The stake is in flight with no on-chain
            recovery path (docs/TODO.md 2.1). The server log has the matchId and player.

      - alert: CrossChainOrphanSeat
        expr: increase(lms_crosschain_orphans_total[15m]) > 0
        labels: { severity: page }
        annotations:
          summary: "Hub seated a player from chain {{ $labels.origin }} that the spoke never forwarded"
          description: Misconfigured peer, or a messenger delivering a message the spoke did not send.

      - alert: ReplayMismatch
        expr: increase(lms_replay_mismatch_total[1h]) > 0
        labels: { severity: page }
        annotations:
          summary: The engine's independent replay disagrees with a result the server signed
          description: A bug in the engine or the replay. The signed result is one no third party can reproduce.

      - alert: SettlementFailing
        expr: increase(lms_chain_tx_total{action="settle",outcome="error"}[15m]) > 0
        labels: { severity: page }
        annotations:
          summary: Settlement transactions are failing
          description: Matches stay Live until their deadline and then refund. Check the attestor key and RPC.

      - alert: GasWalletLow
        expr: lms_wallet_balance_wei < 5e16
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "The {{ $labels.role }} key is below 0.05 ETH"
          description: Locks, settlements, harvests or relayed session calls will start failing when it runs dry.

  - name: lms-service
    rules:
      - alert: BridgeStale
        expr: time() - lms_bridge_last_success_timestamp_seconds > 120
        labels: { severity: page }
        annotations:
          summary: The escrow bridge has not completed a poll in two minutes
          description: New lobbies are not discovered and live matches do not open rooms. Check the hub RPC.

      - alert: EventLoopLag
        expr: lms_nodejs_eventloop_lag_p99_seconds > 0.1
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: Event-loop p99 lag above 100 ms
          description: Round deadlines and broadcasts are being delayed. See the load-testing notes in docs/OBSERVABILITY.md.

      - alert: ConnectionsRefused
        expr: sum by (reason) (rate(lms_ws_refused_total[5m])) > 1
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "Refusing connections ({{ $labels.reason }})"
          description: Either an attack or limits set too tight for real traffic. Per-IP refusals behind a proxy usually mean TRUST_PROXY is unset.

      - alert: MissedMovesSpike
        expr: sum(rate(lms_missed_moves_total[10m])) / clamp_min(sum(rate(lms_rounds_resolved_total[10m])), 1e-9) > 0.5
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: Players are missing moves in more than half of rounds
          description: Players are dropping, the clock is too tight, or frames are being lost between client and server.
