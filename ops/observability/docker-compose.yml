# Local observability stack for the game server.
#
#   npm run obs:up      # Prometheus :9090, Grafana :3000 (admin/admin), Jaeger :16686
#   npm run obs:down
#
# The server is expected on the host: Prometheus scrapes host.docker.internal:9464
# (set METRICS_HOST=0.0.0.0 so the container can reach it), and traces go to
# Jaeger's OTLP endpoint when the server runs with
# OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
name: lms-observability

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP over HTTP
