[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000
via_ir = false
bytecode_hash = "none"
# The settlement libraries are hand-written Yul; keep the compiler honest about it.
deny_warnings = false

[profile.default.fuzz]
runs = 512
max_test_rejects = 200_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5_000

# Deeper campaign for CI / pre-release. Run with: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 20_000

[profile.deep.invariant]
runs = 2_000
depth = 256

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
