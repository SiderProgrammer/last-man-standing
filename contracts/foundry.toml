[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000
via_ir = false
bytecode_hash = "none"
# Compiler warnings fail the build.
deny = "warnings"
# `Deploy` reads the rule set from `config/rules.json`.
fs_permissions = [{ access = "read", path = "./config" }]

[lint]
# Lint only what ships. Slither runs on the same sources in CI.
ignore = ["test/**/*.sol", "script/**/*.sol"]
# False positive on every `1 << n` bitmask, which is the right operand order.
exclude_lints = ["incorrect-shift"]

[profile.default.fuzz]
# Fixed, so fuzz and invariant campaigns (and their .gas-snapshot lines) are
# reproducible. For a campaign on fresh randomness, pass `--fuzz-seed`.
seed = "0x4c4d53"
runs = 512
max_test_rejects = 200_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5_000

# Deeper campaign for CI / pre-release. Run with: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 20_000

[profile.deep.invariant]
runs = 2_000
depth = 256

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
